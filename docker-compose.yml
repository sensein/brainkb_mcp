# Local test of the containerized MCP (streamable-http).
# The MCP reaches the BrainKB query_service via BRAINKB_URL. To hit a stack
# running on the host from inside the container, use host.docker.internal.
#
# Auth is per-caller: a PAT or an 'Authorization: Bearer' header. There is no
# auto-login, and a baked-in BRAINKB_TOKEN is ignored on this transport (it would
# make every anonymous caller act as one user) unless MCP_ALLOW_SHARED_IDENTITY
# is set. Never commit credentials or bake them into an image.
services:
  brainkb-mcp:
    build: .
    image: brainkb-mcp:local
    container_name: brainkb-mcp
    ports:
      # Loopback by DEFAULT: the MCP speaks PLAINTEXT http and performs no
      # transport-level authentication, so it must not be reachable directly.
      # Terminate TLS in the reverse proxy in front of it and let that be the only
      # ingress.
      #
      # Loopback only works when the proxy runs on this host. An ALB forwarding
      # straight to the instance cannot reach 127.0.0.1 — set MCP_BIND_ADDR=0.0.0.0
      # in .env for that, and restrict TCP 8080 to the ALB's security group. Docker
      # publishes via iptables and bypasses host firewalls (ufw), so the security
      # group is the only thing standing in front of an unauthenticated endpoint.
      - "${MCP_BIND_ADDR:-127.0.0.1}:8080:8080"
    environment:
      MCP_TRANSPORT: streamable-http
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8080"
      # Backends a caller may target via X-BrainKB-Base-URL / base_url. BRAINKB_URL
      # is always allowed; everything else is refused, because that URL is where
      # credentials get sent. Empty is the tightest setting and correct when the
      # stack is co-located (below). Pair each extra backend with its usermanagement
      # URL, since the :8010 -> :8004 convention never applies to an https host:
      #   MCP_ALLOWED_BASE_URLS: https://queryservice.example.org=https://usermanagement.example.org
      # Never list mcp.brainkb.org — that is this server, not a backend.
      MCP_ALLOWED_BASE_URLS: ${MCP_ALLOWED_BASE_URLS:-}
      # IPs of the reverse proxy in front of this container. Required for
      # per-client rate limiting — without it X-Forwarded-For is ignored (it is
      # caller-controlled and forgeable) and every request keys on the proxy.
      MCP_TRUSTED_PROXIES: ${MCP_TRUSTED_PROXIES:-}
      # Directory brainkb_ingest_files may read. Paths resolve on the SERVER's
      # filesystem, so file ingest stays disabled here unless you set this — and
      # the path is INSIDE the container, so uncomment the volume mount below too.
      MCP_INGEST_ROOT: ${MCP_INGEST_ROOT:-}
      # The BrainKB stack runs on the SAME host (EC2), publishing :8010/:8004.
      # A container's own `localhost` isn't the host, so we reach them via
      # host.docker.internal (mapped below for Linux). Overridable from .env.
      BRAINKB_URL: ${BRAINKB_URL:-http://host.docker.internal:8010}
      USERMANAGEMENT_URL: ${USERMANAGEMENT_URL:-http://host.docker.internal:8004}
      # Large-file ingest without touching the caller's context: the server fetches
      # the URL itself. Empty disables the tool (a server-side fetch of a supplied
      # URL is SSRF), so name the hosts you will serve files from.
      # POST /upload: the client streams a file straight to the server, which then
      # ingests it internally. Persist the staging dir if you want uploads to
      # survive a restart (see the volumes entry below).
      MCP_UPLOAD_ENABLED: ${MCP_UPLOAD_ENABLED:-true}
      MCP_UPLOAD_DIR: ${MCP_UPLOAD_DIR:-/var/lib/brainkb-uploads}
      MCP_UPLOAD_MAX_BYTES: ${MCP_UPLOAD_MAX_BYTES:-5000000000}
      MCP_UPLOAD_TOTAL_BYTES: ${MCP_UPLOAD_TOTAL_BYTES:-20000000000}
      MCP_UPLOAD_TTL_MIN: ${MCP_UPLOAD_TTL_MIN:-360}
      MCP_INGEST_URL_ALLOWLIST: ${MCP_INGEST_URL_ALLOWLIST:-}
      MCP_MAX_INGEST_URL_BYTES: ${MCP_MAX_INGEST_URL_BYTES:-1000000000}
      MCP_INGEST_URL_ALLOW_HTTP: ${MCP_INGEST_URL_ALLOW_HTTP:-false}
    # First entry: only if you set MCP_INGEST_ROOT (remote file ingest) — the
    # container path must match it exactly, and ro so ingest can't write into it.
    # Second: persist POST /upload's staging area, so a restart mid-upload doesn't
    # lose staged files. Without it they live in the container's temp dir, which is
    # fine (they expire anyway) but does not survive a redeploy.
    # volumes:
    #   - /srv/brainkb-ingest:/srv/brainkb-ingest:ro
    #   - /var/lib/brainkb-uploads:/var/lib/brainkb-uploads
    # Make host.docker.internal resolve to the host on Linux/EC2 (it's built in on
    # macOS/Windows Docker Desktop). This is what lets the MCP reach the
    # co-located query_service/usermanagement without host networking, keeping
    # :8080 cleanly published for the mcp.brainkb.org reverse proxy.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Config only (BRAINKB_URL and the guards above). No auto-login creds —
    # authenticate with a PAT or a per-caller Authorization header.
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
