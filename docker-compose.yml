# Local test of the containerized MCP (streamable-http).
# The MCP reaches the BrainKB query_service via BRAINKB_URL. To hit a stack
# running on the host from inside the container, use host.docker.internal.
#
# Local auto-login (optional): put BRAINKB_EMAIL / BRAINKB_PASSWORD in a
# git-ignored .env next to this file (see .env.example). Do NOT commit it, and do
# NOT bake credentials into a remote/production image — see README "Remote
# deployment" for the safe (per-user header) approach.
services:
  brainkb-mcp:
    build: .
    image: brainkb-mcp:local
    container_name: brainkb-mcp
    ports:
      - "8080:8080"
    environment:
      MCP_TRANSPORT: streamable-http
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8080"
      # On macOS/Windows Docker Desktop, host.docker.internal = the host machine.
      BRAINKB_URL: http://host.docker.internal:8010
    # Optional local-only credentials for auto-login (file may be absent).
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
